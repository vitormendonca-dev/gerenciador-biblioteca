{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundHub - Início</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Cabeçalho (Navbar tipo YouTube com busca no topo/canto) -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-4">
      
      <!-- Logótipo -->
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎧</span>
        <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500 bg-clip-text text-transparent">
          SoundHub
        </h1>
      </div>

      <!-- Barra de Pesquisa no Topo -->
      <div class="flex-1 max-w-xl">
        <input 
          type="search" 
          id="search" 
          placeholder="Pesquisar músicas ou artistas..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-full px-5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner text-sm"
        >
      </div>
      
      <!-- Link para a Playlist Pessoal -->
      <div class="flex items-center gap-3">
        <a href="{% url 'playlist' %}" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-sm rounded-xl transition-all border border-slate-700">
          <span>🎵 Minha Playlist</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-6 py-10 space-y-8">
    
    <!-- Título da Seção -->
    <div>
      <h2 id="titulo-secao" class="text-xl font-bold text-slate-100">Explorar Músicas em Alta</h2>
      <p class="text-sm text-slate-400 mt-0.5">Descobre as faixas mais populares do momento ou pesquisa o que quiseres.</p>
    </div>

    <!-- Grelha onde aparecem as músicas (Em alta ou Resultados da Pesquisa) -->
    <ul id="list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 list-none p-0">
      <!-- O JavaScript preenche isto automaticamente ao carregar -->
    </ul>

  </main>

  <script src="{% static 'biblioteca/script_busca.js' %}"></script>
</body>
</html>
